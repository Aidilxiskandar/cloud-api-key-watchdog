  <!--
    Centre: (310, 360)  Outer R: 165  Inner R: 72
    Angles (clockwise from 12 o'clock = -90°):
      Seg1 Secret Detection   28%  100.8°  -90.0 → 10.8
      Seg2 Save-Time Protect  22%   79.2°   10.8 → 90.0
      Seg3 Monitoring/Alert   20%   72.0°   90.0 → 162.0
      Seg4 Manual Scanner     18%   64.8°  162.0 → 226.8
      Seg5 Security Hardening 12%   43.2°  226.8 → 270.0

    Pre-computed outer-circle points (R=165):
      -90.0° → (310,  195)
       10.8° → (472.1, 390.9)
       90.0° → (310,  525)
      162.0° → (153.0, 411.0)
      226.8° → (197.5, 239.3)

    Pre-computed inner-circle points (r=72):
      -90.0° → (310,  288)
       10.8° → (380.8, 373.5)
       90.0° → (310,  432)
      162.0° → (241.6, 382.3)
      226.8° → (261.1, 307.3)
  -->

  <!-- ── Seg 1: Secret Detection  28%  teal ── -->
  <path d="M 310 195
           A 165 165 0 0 1 472.1 390.9
           L 380.8 373.5
           A 72  72  0 0 0 310 288 Z"
        fill="#00897b" stroke="#0d1117" stroke-width="4"/>

  <!-- ── Seg 2: Save-Time Protection  22%  blue ── -->
  <path d="M 472.1 390.9
           A 165 165 0 0 1 310 525
           L 310 432
