        fill="#1565c0" stroke="#0d1117" stroke-width="4"/>

  <!-- ── Seg 3: Monitoring & Alerting  20%  orange ── -->
  <path d="M 310 525
           A 165 165 0 0 1 153.0 411.0
           L 241.6 382.3
           A 72  72  0 0 0 310 432 Z"
        fill="#e65100" stroke="#0d1117" stroke-width="4"/>

  <!-- ── Seg 4: Manual Scanner  18%  red ── -->
  <path d="M 153.0 411.0
           A 165 165 0 0 1 197.5 239.3
           L 261.1 307.3
           A 72  72  0 0 0 241.6 382.3 Z"
        fill="#b71c1c" stroke="#0d1117" stroke-width="4"/>

  <!-- ── Seg 5: Security Hardening  12%  purple ── -->
  <path d="M 197.5 239.3
           A 165 165 0 0 1 310 195
           L 310 288
           A 72  72  0 0 0 261.1 307.3 Z"
        fill="#6a1b9a" stroke="#0d1117" stroke-width="4"/>

  <!-- ── Centre hole ── -->
  <circle cx="310" cy="360" r="66" fill="#0d1117"/>
  <circle cx="310" cy="360" r="63" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text x="310" y="352" text-anchor="middle" font-size="11" fill="#8b949e">Cloud API</text>
  <text x="310" y="366" text-anchor="middle" font-size="11" fill="#8b949e">Key</text>
  <text x="310" y="380" text-anchor="middle" font-size="11" fill="#8b949e">Watchdog</text>

